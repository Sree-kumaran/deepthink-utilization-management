services:
  postgres:
    image: postgres:16-alpine
    container_name: uc02-postgres
    environment:
      POSTGRES_DB: uc02
      POSTGRES_USER: uc02
      POSTGRES_PASSWORD: uc02_dev_password
    ports:
      - "5432:5432"
    volumes:
      - uc02_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uc02 -d uc02"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: uc02-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - uc02_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: .
    container_name: uc02-api
    env_file:
      - .env
    environment:
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL:-http://inference-pipeline:8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: uc02-network

volumes:
  uc02_postgres_data:
  uc02_qdrant_data: